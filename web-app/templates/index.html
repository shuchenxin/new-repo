<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文件上传示例</title>
  <style>
    :root{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    .container{max-width:800px;margin:40px auto;padding:20px;border:1px solid #eee;border-radius:8px}
    .drop-zone{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed #bbb;border-radius:8px;cursor:pointer;transition:background .15s}
    .drop-zone.dragover{background:#f3f7ff;border-color:#3b82f6}
    .controls{display:flex;gap:10px;margin-top:12px;align-items:center}
    .file-list{margin-top:16px}
    .file-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;background:#fafafa;border:1px solid #f0f0f0}
    .thumb{width:56px;height:56px;display:inline-block;border-radius:4px;background:#eee;overflow:hidden;flex:0 0 56px}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .meta{flex:1}
    .progress{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-top:6px}
    .progress > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#60a5fa)}
    button{padding:8px 12px;border-radius:6px;border:1px solid #d1d5db;background:white;cursor:pointer}
    button.primary{background:#3b82f6;color:white;border-color:transparent}
    small{color:#666}
  </style>
</head>
<body>
  <div class="container">
    <h2>文件上传窗口（支持拖拽 / 预览 / 进度）</h2>
    <p>点击或拖拽文件到下方区域。支持多文件。示例中上传到 <code>/upload</code>（你可以改成真实后端）。</p>

    <div id="dropZone" class="drop-zone" tabindex="0">
      <div style="text-align:center">
        <strong>将文件拖到这里或点击选择</strong>
        <div style="margin-top:8px"><small>支持多文件 · 图片会生成预览</small></div>
      </div>
    </div>

    <div class="controls">
      <label style="display:inline-flex;align-items:center;gap:8px">
        <input id="fileInput" type="file" multiple style="display:none" accept="*/*">
        <button type="button">选择文件</button>
      </label>
      <button id="uploadBtn" class="primary" type="button">上传所有文件</button>
      <div style="margin-left:auto"><small id="hint">尚未选择文件</small></div>
    </div>

    <div class="file-list" id="fileList"></div>
  </div>

  <script>
    // 配置
    const UPLOAD_URL = 'http://localhost:5001/upload'; // 改成后端上传接口
    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB 单文件上限（可修改）

    // DOM
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const hint = document.getElementById('hint');

    let files = []; // {file, id, status, progress}

    function humanFileSize(size){
      if(size === 0) return '0 B';
      const i = Math.floor(Math.log(size) / Math.log(1024));
      return (size / Math.pow(1024, i)).toFixed(2) + ' ' + ['B','KB','MB','GB','TB'][i];
    }

    function renderList(){
      fileList.innerHTML = '';
      if(files.length === 0){ hint.textContent = '尚未选择文件'; return }
      hint.textContent = `${files.length} 个文件，准备上传`;

      files.forEach(item => {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.dataset.id = item.id;

        const thumb = document.createElement('div'); thumb.className = 'thumb';
        // 如果是图片，显示缩略图
        if(item.file.type.startsWith('image/')){
          const img = document.createElement('img');
          const reader = new FileReader();
          reader.onload = e => img.src = e.target.result;
          reader.readAsDataURL(item.file);
          thumb.appendChild(img);
        } else {
          thumb.textContent = item.file.name.split('.').pop() || 'FILE';
          thumb.style.display = 'flex'; thumb.style.alignItems = 'center'; thumb.style.justifyContent = 'center';
        }

        const meta = document.createElement('div'); meta.className = 'meta';
        meta.innerHTML = `<div><strong>${item.file.name}</strong> <small> · ${humanFileSize(item.file.size)}</small></div>`;

        const progressWrap = document.createElement('div'); progressWrap.className = 'progress';
        const prog = document.createElement('i'); prog.style.width = (item.progress || 0) + '%'; progressWrap.appendChild(prog);

        const statusLine = document.createElement('div');
        statusLine.style.display = 'flex'; statusLine.style.gap = '8px'; statusLine.style.alignItems = 'center';
        const statusText = document.createElement('small'); statusText.textContent = item.status || '未上传';

        const removeBtn = document.createElement('button'); removeBtn.textContent = '移除';
        removeBtn.onclick = () => { files = files.filter(f => f.id !== item.id); renderList(); };

        statusLine.appendChild(statusText);
        statusLine.appendChild(removeBtn);

        meta.appendChild(progressWrap);
        meta.appendChild(statusLine);

        el.appendChild(thumb);
        el.appendChild(meta);

        fileList.appendChild(el);
      });
    }

    function addFiles(selectedFiles){
      const arr = Array.from(selectedFiles).map(f => ({file: f, id: crypto.randomUUID(), status: '等待中', progress: 0}));
      // 过滤大文件
      const valid = arr.filter(a => {
        if(a.file.size > MAX_FILE_SIZE){
          alert(`文件 ${a.file.name} 超过大小限制 ${humanFileSize(MAX_FILE_SIZE)}`);
          return false;
        }
        return true;
      });
      files = files.concat(valid);
      renderList();
    }

    // 处理拖拽
    ;['dragenter','dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); });
    });
    ;['dragleave','drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover'); });
    });
    dropZone.addEventListener('drop', e => {
      if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });

    // 点击选择
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => addFiles(e.target.files));

    // 键盘可访问性（回车/空格触发文件选择）
    dropZone.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') fileInput.click(); });

    // 上传逻辑（示例：使用 fetch + FormData，展示进度）
    async function uploadFileItem(item){
      item.status = '上传中'; renderList();

      // 如果服务器支持分块或返回进度事件，最好使用 xhr；示例使用 XHR 来显示进度
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', UPLOAD_URL, true);

        xhr.upload.onprogress = function(e){
          if(e.lengthComputable){
            const p = Math.round((e.loaded / e.total) * 100);
            item.progress = p; renderList();
          }
        };

        xhr.onload = function(){
          if(xhr.status >= 200 && xhr.status < 300){
            item.status = '已完成'; item.progress = 100; renderList(); resolve(xhr.responseText);
          } else {
            item.status = `错误 ${xhr.status}`; renderList(); reject(new Error(xhr.statusText || '上传错误'));
          }
        };

        xhr.onerror = function(){ item.status = '网络错误'; renderList(); reject(new Error('网络错误')); };

        const form = new FormData();
        form.append('file', item.file, item.file.name);
        // 如果需要其他字段：form.append('userId', '123');
        xhr.send(form);
      });
    }

    uploadBtn.addEventListener('click', async () => {
      if(files.length === 0){ alert('请先选择文件'); return }
      uploadBtn.disabled = true; uploadBtn.textContent = '上传中...';

      for(const item of files){
        // 跳过已经上传成功的文件
        if(item.status === '已完成') continue;
        try{
          await uploadFileItem(item);
        } catch(err){
          console.error('上传失败', err);
          // 失败时不停止全部上传，继续下一个
        }
      }

      uploadBtn.disabled = false; uploadBtn.textContent = '上传所有文件';
      alert('上传流程结束（请查看每个文件状态）');
    });

    // 初始渲染
    renderList();
  </script>
</body>
</html>
